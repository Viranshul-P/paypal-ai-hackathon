<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Pauseline{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
  <link rel="icon" href="/favicon.ico" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css">
  {% block head %}{% endblock %}
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/"><span class="brand-mark" aria-hidden="true"><span></span><span></span></span>Pauseline</a>
    <nav class="nav" aria-label="Main">
      <a href="/send" {% if active == 'send' %}aria-current="page"{% endif %}>Send money</a>
      <a href="/family" {% if active == 'family' %}aria-current="page"{% endif %}>Family view</a>
      <a href="/setup" {% if active == 'setup' %}aria-current="page"{% endif %}>Setup</a>
    </nav>
    <span class="mode" title="Payment provider and risk engine in use">
      PayPal: {{ 'sandbox' if paypal_live else 'demo' }} · AI: {{ ai_mode }}
    </span>
  </header>
  {% block body %}{% endblock %}
  <script src="/static/common.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
