<section id="lock" class="slip stack hidden" aria-labelledby="lock-h">
  <div>
    <h1 id="lock-h">Enter the family PIN</h1>
    <p class="lede">Only {{ contact_name }} should open this page. If someone on the phone asks {{ payer_name }} to open it, that is a scam.</p>
  </div>
  <form id="lock-form" class="stack">
    <div>
      <label for="pin">Family PIN</label>
      <input id="pin" class="pin-input" type="password" inputmode="numeric" autocomplete="off" maxlength="12" required>
    </div>
    <p id="lock-error" class="banner stop hidden" role="alert"></p>
    <button class="btn btn-primary btn-block" type="submit">Open</button>
  </form>
  {% if demo_pin %}<p class="small muted">This demo uses the PIN {{ demo_pin }}.</p>{% endif %}
</section>
