<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Pauseline{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" href="/favicon.ico" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css">
  {% block head %}{% endblock %}
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/"><span class="brand-mark" aria-hidden="true"><span></span><span></span></span>Pauseline</a>
    <nav class="nav" aria-label="Main">
      <a href="/send" data-hi="पैसे भेजें" {% if active == 'send' %}aria-current="page"{% endif %}>Send money</a>
      <a href="/family" data-hi="फ़ैमिली व्यू" {% if active == 'family' %}aria-current="page"{% endif %}>Family view</a>
      <a href="/setup" data-hi="सेटअप" {% if active == 'setup' %}aria-current="page"{% endif %}>Setup</a>
    </nav>
    <button id="lang-toggle" class="lang" type="button" aria-label="Change language">हिन्दी</button>
  </header>
  {% block body %}{% endblock %}
  <footer class="foot">PayPal {{ 'sandbox' if paypal_live else 'demo mode' }}. AI: {{ ai_mode }}.</footer>
  <script src="/static/common.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
