[project]
name = "pauseline"
version = "0.1.0"
description = "Pauseline: a pause before money leaves. Scam-aware payment holds with a trusted family contact, built on PayPal."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "httpx>=0.27",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[project.scripts]
pauseline = "pauseline.app:main"

[project.optional-dependencies]
eval = ["matplotlib>=3.8"]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pauseline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
